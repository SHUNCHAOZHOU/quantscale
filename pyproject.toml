[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quantscale"
version = "0.1.0"
description = "Controlled experiments in autonomous quantitative research scaling"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
data = ["yfinance>=1.2"]

[project.scripts]
quantscale = "quantscale.cli:main"

[tool.setuptools.packages.find]
include = ["quantscale*"]
